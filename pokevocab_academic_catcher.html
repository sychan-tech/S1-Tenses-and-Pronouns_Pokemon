<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéVocab: Academic Catcher</title>
    <!-- MediaPipe Hands and Camera Libraries for Web-based AI Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; text-align: center; overflow-x: hidden; }
        
        #app-header { margin-top: 15px; }
        h1 { color: #facc15; text-shadow: 3px 3px 0 #dc2626; font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { color: #38bdf8; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; }

        /* Lobby UI */
        .card { background: #1e293b; max-width: 450px; margin: 20px auto; padding: 25px; border-radius: 16px; border: 3px solid #38bdf8; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { width: 85%; padding: 12px; margin: 10px 0; font-size: 1rem; border-radius: 8px; border: 2px solid #38bdf8; background: #0f172a; color: white; text-align: center; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        button { padding: 12px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-red { background: #ef4444; color: white; }
        .btn-yellow { background: #eab308; color: black; }
        button:hover { transform: scale(1.05); }

        /* Game Arena */
        #game-screen { display: none; position: relative; width: 100vw; max-width: 1200px; margin: 0 auto; } /* Increased max-width */
        #game-layout { display: flex; gap: 20px; align-items: flex-start; justify-content: center; } /* Flex layout for canvas + leaderboard */
        #game-content { flex-grow: 1; max-width: 900px; }
        
        #hud { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 12px; margin-bottom: 10px; border: 2px solid #facc15; }
        .hud-item { font-size: 1.1rem; font-weight: bold; }
        
        #canvas-container { position: relative; width: 100%; height: 500px; border-radius: 16px; overflow: hidden; border: 4px solid #facc15; background: #000; }
        
        /* The video element is required for MediaPipe but hidden. We draw it on the canvas instead. */
        video { display: none; }
        canvas { width: 100%; height: 100%; display: block; }

        #room-info { margin-top: 10px; color: #94a3b8; font-size: 0.9rem; }
        
        /* Camera Status Overlay */
        #camera-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 1.5rem; font-weight: bold; background: rgba(0,0,0,0.7); padding: 15px 30px; border-radius: 10px; pointer-events: none; }

        /* Persistent Leaderboard */
        #side-leaderboard { background: #1e293b; border: 3px solid #38bdf8; border-radius: 16px; padding: 20px; width: 250px; color: white; text-align: left; }
        #side-leaderboard h3 { color: #facc15; text-align: center; margin-bottom: 15px; font-size: 1.2rem; }
        .lb-entry { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1rem; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .lb-entry:last-child { border-bottom: none; }
        .lb-name { color: #e2e8f0; }
        .lb-score { color: #4ade80; font-weight: bold; }
        .lb-current-player { color: #facc15; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-header">
        <h1>POKEVOCAB</h1>
        <div class="subtitle">HK S1: Tenses & Pronouns</div>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="card">
        <p style="margin-bottom: 12px; color: #cbd5e1;">Stand back, wave your hands left and right to catch the correct answer!</p>
        <input type="text" id="player-name" placeholder="Enter Student Name" autocomplete="off">
        <input type="text" id="room-code-input" placeholder="ROOM CODE (TO JOIN)" style="display:none;" autocomplete="off">
        
        <div class="btn-group">
            <button class="btn-red" id="create-btn">Create Room</button>
            <button class="btn-yellow" id="join-btn">Join Room</button>
        </div>
        <div id="lobby-status" style="margin-top: 15px; color: #facc15; font-weight: bold;"></div>
    </div>

    <!-- GAME PLAY SCREEN -->
    <div id="game-screen">
        <div id="game-layout">
            <!-- Left Side: Game Canvas & HUD -->
            <div id="game-content">
                <div id="hud">
                    <div class="hud-item" style="color:#38bdf8;" id="hud-player">Player: -</div>
                    <div class="hud-item" style="color:#4ade80;" id="hud-saved">Saved: 0/20</div>
                    <div class="hud-item" style="color:#f43f5e;" id="hud-timer">Time: 0s</div>
                </div>

                <div id="canvas-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="game-canvas"></canvas>
                    <div id="camera-status">Initializing AI Camera... Please wait.</div>
                </div>
                <div id="room-info">Room Code: <span id="current-room-tag" style="color:#facc15;">-</span></div>
            </div>

            <!-- Right Side: Persistent Leaderboard -->
            <div id="side-leaderboard">
                <h3>🏆 TOP TRAINERS 🏆</h3>
                <div id="lb-list">
                    <!-- Leaderboard entries will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 20 HK S1 SYLLABUS QUESTIONS (10 TENSES, 10 PRONOUNS)
        const vocabularyData = [
            // Tenses
            { prompt: "He ___ to school every day.", options: ["goes", "is going"], correct: ["goes"] },
            { prompt: "Look! The bus ___.", options: ["is arriving", "arrives"], correct: ["is arriving"] },
            { prompt: "I ___ a great movie yesterday.", options: ["watched", "watch"], correct: ["watched"] },
            { prompt: "They ___ dinner at the moment.", options: ["are eating", "eat"], correct: ["are eating"] },
            { prompt: "We usually ___ basketball on Sundays.", options: ["play", "played"], correct: ["play"] },
            { prompt: "She ___ her homework last night.", options: ["finished", "finishes"], correct: ["finished"] },
            { prompt: "Water ___ at 100 degrees Celsius.", options: ["boils", "is boiling"], correct: ["boils"] },
            { prompt: "Listen! Someone ___ the piano.", options: ["is playing", "plays"], correct: ["is playing"] },
            { prompt: "My father ___ in a bank.", options: ["works", "is working"], correct: ["works"] },
            { prompt: "I ___ my keys yesterday.", options: ["lost", "lose"], correct: ["lost"] },
            // Pronouns
            { prompt: "This book is mine. Where is ___?", options: ["yours", "your"], correct: ["yours"] },
            { prompt: "My brother hurt ___ while playing.", options: ["himself", "him"], correct: ["himself"] },
            { prompt: "Please give the pen to ___.", options: ["me", "I"], correct: ["me"] },
            { prompt: "Mary and I are friends. ___ study together.", options: ["We", "Us"], correct: ["We"] },
            { prompt: "That is not her jacket. ___ is blue.", options: ["Hers", "She"], correct: ["Hers"] },
            { prompt: "Did you make this cake by ___?", options: ["yourself", "you"], correct: ["yourself"] },
            { prompt: "Let ___ help you with those bags.", options: ["us", "we"], correct: ["us"] },
            { prompt: "The dog is wagging ___ tail.", options: ["its", "it's"], correct: ["its"] },
            { prompt: "The teacher asked ___ a question.", options: ["him", "he"], correct: ["him"] },
            { prompt: "They bought the house for ___.", options: ["themselves", "them"], correct: ["themselves"] }
        ];

        let leaderboard = [
            { name: "Chris Wong", time: 45 },
            { name: "Mary Lee", time: 52 },
            { name: "Peter Chan", time: 60 },
            { name: "Kelly Ho", time: 75 },
            { name: "Tom Ma", time: 85 }
        ];
        let scoreRecorded = false;
        let finalTime = 0; // Added variable to hold final time

        let roomCode = "";
        let playerName = "";
        let currentQIndex = 0;
        let savedCount = 0;
        let startTime = 0;
        let timerInterval = null;

        // GAME CANVAS & ANIMATION
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let catcherX = 400; // Center screen default
        let fallingItems = [];
        let savedPokemonList = []; // Will store the actual Image objects of caught Pokemon

        // DOM Elements
        const playerNameInput = document.getElementById('player-name');
        const roomCodeInput = document.getElementById('room-code-input');
        const createBtn = document.getElementById('create-btn');
        const joinBtn = document.getElementById('join-btn');
        const lobbyStatus = document.getElementById('lobby-status');
        const cameraStatus = document.getElementById('camera-status');
        const videoElement = document.getElementById('webcam');

        createBtn.onclick = () => {
            playerName = playerNameInput.value.trim() || "Trainer";
            roomCode = "POKE-" + Math.floor(1000 + Math.random() * 9000);
            initRoom();
        };

        joinBtn.onclick = () => {
            if (roomCodeInput.style.display === "none") {
                roomCodeInput.style.display = "inline-block";
                lobbyStatus.innerText = "Enter Room Code and click Join Room again.";
                return;
            }
            playerName = playerNameInput.value.trim() || "Trainer";
            roomCode = roomCodeInput.value.trim().toUpperCase() || "POKE-1001";
            initRoom();
        };

        function initRoom() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('hud-player').innerText = `Player: ${playerName}`;
            document.getElementById('current-room-tag').innerText = roomCode;

            updateSideLeaderboard(); // Populate initial leaderboard
            startCameraAndGame();
        }

        // Updating the side leaderboard UI
        function updateSideLeaderboard() {
            const lbList = document.getElementById('lb-list');
            lbList.innerHTML = ''; // Clear current list
            
            // Sort leaderboard
            let sortedLb = [...leaderboard].sort((a, b) => a.time - b.time);
            
            // Add an entry for current player if game is active
            let currentPlayerEntryHtml = '';
            if (!scoreRecorded) {
                currentPlayerEntryHtml = `<div class="lb-entry lb-current-player"><span class="lb-name">${playerName} (You)</span><span class="lb-score">...</span></div>`;
            }

            let htmlContent = '';
            sortedLb.slice(0, 5).forEach((entry, idx) => {
                const isCurrentPlayer = entry.name === playerName;
                const nameClass = isCurrentPlayer ? "lb-current-player" : "lb-name";
                const displayTime = entry.time === "..." ? "..." : `${entry.time}s`;
                htmlContent += `<div class="lb-entry ${isCurrentPlayer ? 'lb-current-player' : ''}"><span class="${nameClass}">${idx + 1}. ${entry.name}</span><span class="lb-score">${displayTime}</span></div>`;
            });
            
            lbList.innerHTML = htmlContent;
        }

        // Fetch a random Pokemon Sprite from PokeAPI
        function getRandomPokemonImage() {
            const img = new Image();
            // Get a random Pokemon ID between 1 and 151 (Gen 1)
            const randomId = Math.floor(Math.random() * 151) + 1;
            // Use the direct sprite URL from PokeAPI's github raw content
            img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${randomId}.png`;
            return img;
        }

        function startCameraAndGame() {
            canvas.width = 800;
            canvas.height = 500;

            // Initialize MediaPipe Hands
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1, // Track 1 hand to control the basket
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            // Hand Tracking Callback
            hands.onResults((results) => {
                cameraStatus.style.display = 'none'; // Hide loading message once tracking starts
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    // Get the X coordinate of the wrist (landmark 0) or palm
                    const handX = results.multiHandLandmarks[0][0].x; 
                    
                    // Because the video is mirrored, we must invert the X coordinate
                    // 0 is left edge of camera, 1 is right edge of camera
                    catcherX = (1 - handX) * canvas.width;
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { 
                    await hands.send({ image: videoElement }); 
                },
                width: 640,
                height: 480
            });

            camera.start().catch((err) => {
                console.error(err);
                cameraStatus.innerText = "Camera access denied. Please allow camera to play.";
            });

            // Start Game Loop
            startTime = Date.now();
            scoreRecorded = false; // Reset for new game
            timerInterval = setInterval(updateTimer, 1000);
            spawnQuestion(currentQIndex);
            requestAnimationFrame(gameLoop);
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('hud-timer').innerText = `Time: ${elapsed}s`;
        }

        function spawnQuestion(index) {
            if (index >= vocabularyData.length) return;
            const q = vocabularyData[index];
            
            // Randomize position of correct answer
            const isFirstCorrect = Math.random() > 0.5;
            const leftWord = isFirstCorrect ? q.options[0] : q.options[1];
            const rightWord = isFirstCorrect ? q.options[1] : q.options[0];

            fallingItems = [
                { 
                    text: leftWord, 
                    x: 250, 
                    y: -50, 
                    speed: 2, 
                    isCorrect: q.correct.includes(leftWord),
                    img: getRandomPokemonImage() // Assign a PokeAPI image
                },
                { 
                    text: rightWord, 
                    x: 550, 
                    y: -50, 
                    speed: 2, 
                    isCorrect: q.correct.includes(rightWord),
                    img: getRandomPokemonImage() // Assign a PokeAPI image
                }
            ];
        }

        function gameLoop() {
            // 1. Draw WebCam Feed (Mirrored) as the background
            ctx.save();
            ctx.scale(-1, 1);
            // Draw video inverted so it feels like a mirror
            ctx.drawImage(videoElement, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();

            // Add a slight dark tint so the text and game elements pop out clearly
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Grass / Lawn at the bottom
            ctx.fillStyle = '#22c55e'; // Green lawn
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            // Darker grass trim
            ctx.fillStyle = '#166534';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 10);

            // 3. Draw Saved Pokemon on the Lawn
            savedPokemonList.forEach((pokeObj, idx) => {
                // Calculate position on the lawn to stack them neatly in the center
                const row = Math.floor(idx / 10);
                const col = idx % 10;
                const pokeX = 60 + (col * 75); // Spaced evenly across the screen
                const pokeY = canvas.height - 60 + (row * 25);
                
                // Draw the caught PokeAPI image much larger (80x80)
                if (pokeObj.img.complete) {
                    ctx.drawImage(pokeObj.img, pokeX - 40, pokeY - 40, 80, 80);
                }
            });

            // 4. Render Game Elements (If active)
            if (currentQIndex < vocabularyData.length) {
                const q = vocabularyData[currentQIndex];
                
                // Draw Top Prompt Banner exactly centered
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.beginPath();
                ctx.roundRect(100, 15, 600, 50, 10); // Wider and centered (100px from left + 600 width + 100px from right = 800)
                ctx.fill();
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px sans-serif'; // Slightly larger font
                ctx.textAlign = 'center';
                ctx.fillText(`Word for: "${q.prompt.toUpperCase()}"`, 400, 48);

                // Update and Draw Falling Pokemon Options
                fallingItems.forEach(item => {
                    item.y += item.speed;

                    // Draw the Pokemon Sprite
                    if (item.img.complete) {
                        // Draw a faint glow behind the Pokemon based on if it's correct (optional, but helps visibility)
                        ctx.fillStyle = item.isCorrect ? 'rgba(74, 222, 128, 0.3)' : 'rgba(56, 189, 248, 0.3)';
                        ctx.beginPath();
                        ctx.arc(item.x, item.y, 40, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Draw actual sprite
                        ctx.drawImage(item.img, item.x - 45, item.y - 45, 90, 90);
                    }

                    // Draw the Vocabulary Text below the Pokemon
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fillRect(item.x - 50, item.y + 35, 100, 25);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText(item.text, item.x, item.y + 53);

                    // COLLISION DETECTION: Has it hit the net?
                    // Catcher height is canvas.height - 80. Hand threshold is roughly 60px wide.
                    if (item.y >= canvas.height - 130 && item.y <= canvas.height - 50 && Math.abs(item.x - catcherX) < 70) {
                        if (item.isCorrect) {
                            // Correct! Save it to the lawn
                            savedCount++;
                            savedPokemonList.push({ img: item.img });
                            document.getElementById('hud-saved').innerText = `Saved: ${savedCount}/20`;
                            
                            // Move to next question
                            currentQIndex++;
                            if (currentQIndex < vocabularyData.length) {
                                spawnQuestion(currentQIndex);
                            }
                        } else {
                            // Incorrect, push it back up to try again
                            item.y = -100;
                        }
                    } 
                    // Reset if it hits the ground without being caught
                    else if (item.y > canvas.height + 50) {
                        item.y = -100;
                    }
                });
            } else {
                // GAME OVER STATE
                clearInterval(timerInterval);
                
                // Record score and update leaderboard once
                if (!scoreRecorded) {
                    finalTime = Math.floor((Date.now() - startTime) / 1000);
                    leaderboard.push({ name: playerName, time: finalTime });
                    leaderboard.sort((a, b) => a.time - b.time); // Sort lowest time first
                    leaderboard = leaderboard.slice(0, 5); // Keep top 5
                    scoreRecorded = true;
                    updateSideLeaderboard(); // Update side panel one last time
                }

                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('ALL 20 POKÉMON CAUGHT!', 400, 70);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText(`Amazing effort, ${playerName}!`, 400, 110);
                ctx.fillText(`Final Time: ${finalTime}s`, 400, 140);
                
                // We don't need to draw the leaderboard on canvas anymore since it's on the side
                // Drawing a big congratulations icon or just more pokemon pile instead
                
                // Draw all caught Pokemon in a big celebration pile at the bottom
                savedPokemonList.forEach((pokeObj, idx) => {
                    const row = Math.floor(idx / 10);
                    const col = idx % 10;
                    if (pokeObj.img.complete) {
                        ctx.drawImage(pokeObj.img, 50 + (col * 70), 380 + (row * 50), 60, 60);
                    }
                });
            }

            // 5. Draw Hand Tracking Pokéball Catcher
            
            // Draw Bottom Half (White)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(catcherX, canvas.height - 80, 50, 0, Math.PI, false);
            ctx.fill();

            // Draw Top Half (Red) - using clip to only draw top half
            ctx.save();
            ctx.beginPath();
            ctx.rect(catcherX - 60, canvas.height - 130, 120, 50); // Clip region for top half
            ctx.clip();
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.arc(catcherX, canvas.height - 80, 50, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.restore();
            
            // Outer Rim
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#1e293b'; // Dark blue/black rim
            ctx.beginPath();
            ctx.arc(catcherX, canvas.height - 80, 50, 0, Math.PI, false);
            ctx.stroke();

            // Middle Band (Black)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(catcherX - 50, canvas.height - 83, 100, 6);

            // Center Button (White inner, Black outer)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(catcherX, canvas.height - 80, 15, 0, Math.PI * 2, false);
            ctx.fill();
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();

            // Inner button dot
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(catcherX, canvas.height - 80, 6, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.stroke();

            // Next frame
            requestAnimationFrame(gameLoop);
        }

        ctx.textAlign = 'center';
    </script>
</body>
</html>
